name: medical-bigdata

x-restart: &restart
  restart: unless-stopped

x-hadoop: &hadoop
  <<: *restart
  profiles: [bigdata]
  image: ${HADOOP_IMAGE:-shizr/medicine-bigdata:hadoop-3.4.1}
  networks: [platform]

services:
  mysql:
    <<: *restart
    image: ${MYSQL_IMAGE:-shizr/medicine-bigdata:mysql-1.1.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: his_system
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [platform]

  redis:
    <<: *restart
    image: ${DOCKER_REGISTRY:-m.daocloud.io/docker.io}/library/redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [platform]

  backend:
    <<: *restart
    image: ${BACKEND_IMAGE:-shizr/medicine-bigdata:backend-1.0.0}
    environment:
      SERVER_MODE: release
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: his_system
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      KAFKA_BROKERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      ANALYTICS_FLINK_JOBMANAGER: flink-jobmanager:8081
      ANALYTICS_CLICKHOUSE_HOST: clickhouse
      ANALYTICS_CLICKHOUSE_PORT: 9000
      ANALYTICS_CLICKHOUSE_DATABASE: his_analytics
      ANALYTICS_CLICKHOUSE_USERNAME: default
      ANALYTICS_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks: [platform]

  frontend:
    <<: *restart
    image: ${FRONTEND_IMAGE:-shizr/medicine-bigdata:frontend-1.1.0}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    networks: [platform]

  zookeeper:
    <<: *restart
    profiles: [bigdata]
    image: ${DOCKER_REGISTRY:-m.daocloud.io/docker.io}/confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc 127.0.0.1 2181 | grep 'Mode:'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  kafka:
    <<: *restart
    profiles: [bigdata]
    image: ${DOCKER_REGISTRY:-m.daocloud.io/docker.io}/confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${PUBLIC_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [platform]

  minio:
    <<: *restart
    profiles: [bigdata]
    image: ${DOCKER_REGISTRY:-m.daocloud.io/docker.io}/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [platform]

  clickhouse:
    <<: *restart
    profiles: [bigdata]
    image: ${DOCKER_REGISTRY:-m.daocloud.io/docker.io}/clickhouse/clickhouse-server:25.11.1.558
    environment:
      CLICKHOUSE_DB: his_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9002}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/ping' | grep Ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  flink-jobmanager:
    <<: *restart
    profiles: [bigdata]
    image: ${DOCKER_REGISTRY:-m.daocloud.io/docker.io}/library/flink:1.18-java11
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    ports:
      - "${FLINK_UI_PORT:-8081}:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  flink-taskmanager:
    <<: *restart
    profiles: [bigdata]
    image: ${DOCKER_REGISTRY:-m.daocloud.io/docker.io}/library/flink:1.18-java11
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[T]askManagerRunner'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  hadoop1:
    <<: *hadoop
    hostname: hadoop1
    environment:
      HADOOP_ROLES: namenode,resourcemanager,historyserver
      CLUSTER_NAME: medical-hadoop
    ports:
      - "${HDFS_UI_PORT:-9870}:9870"
      - "${YARN_UI_PORT:-8088}:8088"
      - "${MAPRED_UI_PORT:-19888}:19888"
      - "${HDFS_RPC_PORT:-9003}:9000"
    volumes:
      - hadoop-namenode:/data/hdfs/namenode
      - hadoop1-yarn:/data/yarn
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9870/ >/dev/null && curl -fsS http://hadoop1:8088/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s

  hadoop2:
    <<: *hadoop
    hostname: hadoop2
    environment:
      HADOOP_ROLES: datanode,nodemanager
    ports:
      - "${HADOOP2_DATANODE_UI_PORT:-9864}:9864"
      - "${HADOOP2_NODEMANAGER_UI_PORT:-8042}:8042"
    volumes:
      - hadoop2-datanode:/data/hdfs/datanode
      - hadoop2-yarn:/data/yarn
    depends_on:
      hadoop1:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9864/ >/dev/null && curl -fsS http://127.0.0.1:8042/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s

  hadoop3:
    <<: *hadoop
    hostname: hadoop3
    environment:
      HADOOP_ROLES: datanode,nodemanager
    ports:
      - "${HADOOP3_DATANODE_UI_PORT:-9865}:9864"
      - "${HADOOP3_NODEMANAGER_UI_PORT:-8043}:8042"
    volumes:
      - hadoop3-datanode:/data/hdfs/datanode
      - hadoop3-yarn:/data/yarn
    depends_on:
      hadoop1:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9864/ >/dev/null && curl -fsS http://127.0.0.1:8042/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s

networks:
  platform:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  minio-data:
  clickhouse-data:
  flink-checkpoints:
  flink-savepoints:
  hadoop-namenode:
  hadoop1-yarn:
  hadoop2-datanode:
  hadoop2-yarn:
  hadoop3-datanode:
  hadoop3-yarn:
